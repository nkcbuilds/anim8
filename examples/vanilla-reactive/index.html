<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Anim8 reactive example</title>
  <style>
    body { font: 16px system-ui, sans-serif; margin: 0; padding: 32px; background: #f1f5f9; color: #0f172a; }
    main { max-width: 820px; margin: auto; }
    #player { background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgb(15 23 42 / 0.08); }
    label { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
    input { flex: 1; }
  </style>
</head>
<body>
  <main>
    <h1>Reactive pointer</h1>
    <div id="player" aria-label="Reactive array pointer animation"></div>
    <label>Index <input id="index" type="range" min="0" max="4" value="0" step="1" /> <output id="value">0</output></label>
    <p>Last object event: <output id="event">none</output></p>
  </main>
  <script type="module" src="./dist/app.js"></script>
</body>
</html>
