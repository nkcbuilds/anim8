version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-tooling:
        patterns:
          - "typescript"
          - "vitest"
          - "tsup"
          - "esbuild"
          - "playwright"
          - "publint"
          - "@arethetypeswrong/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
