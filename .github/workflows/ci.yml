name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A burst of commits should not run obsolete PR checks concurrently.
# Keep main checks independent so every merged commit is verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm docs:check

      - name: Run baseline benchmark
        run: pnpm benchmark

      - name: Configure reliable Ubuntu package downloads
        run: bash .github/scripts/prepare-apt.sh

      - name: Install browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser matrix
        run: pnpm browser
        env:
          ANIM8_BROWSER_REQUIRE_ALL: "1"

      - name: Verify rich styles, dashed reveal and static/mounted pixel parity
        run: pnpm browser:styles

      - name: Verify renderer hierarchy and reveal pixels across browsers
        run: pnpm browser:visual

      - name: Save renderer quality evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rendering-quality
          path: artifacts/rendering-quality/
          if-no-files-found: warn

      - name: Save styling previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rich-styles
          path: artifacts/rich-styles/
          if-no-files-found: warn

      - name: Qualify full merge-sort box motion and stable identity
        run: pnpm sorting:browser

      - name: Save merge-sort motion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sorting-motion
          path: artifacts/sorting/
          if-no-files-found: warn

      - name: Validate all 150 gallery scenes in Chromium
        run: pnpm catalog:browser

      - name: Validate animated diagram families in Chromium
        run: pnpm gallery:browser

      - name: Qualify desktop, mobile emulation, throttled CPU and dense scenes
        run: pnpm qualification:matrix

      - name: Save browser qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-qualification
          path: artifacts/qualification/
          if-no-files-found: warn

      - name: Qualify playground playback across browsers and mobile viewport
        run: pnpm playground:browser

      - name: Save playground qualification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playground-qualification
          path: artifacts/playground/
          if-no-files-found: warn

      - name: Install required media qualification tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Inspect and decode real GIF and MP4 exports
        run: pnpm qualification:media

      - name: Validate reference scenes
        run: |
          node packages/cli/dist/cli.js validate examples/two-sum/scene.json
          node packages/cli/dist/cli.js validate examples/database/scene.json
          node packages/cli/dist/cli.js validate examples/geometry/scene.json
          node packages/cli/dist/cli.js validate examples/reactive/scene.json
          node packages/cli/dist/cli.js validate examples/geometry-rich/scene.json
          node packages/cli/dist/cli.js validate examples/binary-search/scene.json
          node packages/cli/dist/cli.js validate examples/bubble-sort/scene.json
          node packages/cli/dist/cli.js validate examples/linked-list/scene.json
          node packages/cli/dist/cli.js validate examples/binary-tree/scene.json

      - name: Measure baseline bundle
        run: pnpm bundle:check
