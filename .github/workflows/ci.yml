name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# A burst of commits should not run obsolete PR checks concurrently.
# Keep main checks independent so every merged commit is verified.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check

      - name: Run baseline benchmark
        run: pnpm benchmark

      - name: Install browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser matrix
        run: pnpm browser
        env:
          ANIM8_BROWSER_REQUIRE_ALL: "1"

      - name: Verify rich styles, dashed reveal and static/mounted pixel parity
        run: pnpm browser:styles

      - name: Save styling previews
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rich-styles
          path: artifacts/rich-styles/
          if-no-files-found: warn

      - name: Qualify full merge-sort box motion and stable identity
        run: pnpm sorting:browser

      - name: Save merge-sort motion evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sorting-motion
          path: artifacts/sorting/
          if-no-files-found: warn

      - name: Validate all 150 gallery scenes in Chromium
        run: pnpm catalog:browser

      - name: Qualify simultaneous playback, mount lifecycle and browser memory
        run: pnpm qualification:browser

      - name: Qualify editable playground in Chromium
        run: pnpm playground:browser

      - name: Export GIF and MP4 through FFmpeg when available
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            mkdir -p .bench
            node packages/export/dist/cli.js examples/catalog/computing/binary-search/scene.json .bench/anim8-ci.gif --fps 10 --duration-ms 500
            node packages/export/dist/cli.js examples/catalog/computing/binary-search/scene.json .bench/anim8-ci.mp4 --fps 10 --duration-ms 500
            test -s .bench/anim8-ci.gif && test -s .bench/anim8-ci.mp4
          else
            echo 'SKIP: FFmpeg is not installed on this runner; exporter unit tests still ran.'
          fi

      - name: Validate reference scenes
        run: |
          node packages/cli/dist/cli.js validate examples/two-sum/scene.json
          node packages/cli/dist/cli.js validate examples/database/scene.json
          node packages/cli/dist/cli.js validate examples/geometry/scene.json
          node packages/cli/dist/cli.js validate examples/reactive/scene.json
          node packages/cli/dist/cli.js validate examples/geometry-rich/scene.json
          node packages/cli/dist/cli.js validate examples/binary-search/scene.json
          node packages/cli/dist/cli.js validate examples/bubble-sort/scene.json
          node packages/cli/dist/cli.js validate examples/linked-list/scene.json
          node packages/cli/dist/cli.js validate examples/binary-tree/scene.json

      - name: Measure baseline bundle
        run: |
          mkdir -p .bench
          pnpm exec esbuild benchmarks/standard-runtime.ts --bundle --minify --format=esm --platform=browser --outfile=.bench/standard-runtime.js
          node -e "const fs=require('fs'),z=require('zlib');const b=fs.readFileSync('.bench/standard-runtime.js');const g=z.gzipSync(b,{level:9});console.log('gzip bytes',g.length);if(g.length>35840)process.exit(1)"
