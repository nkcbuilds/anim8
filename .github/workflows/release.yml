name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Keep manual qualifications separate from publishing runs for the same tag.
concurrency:
  group: release-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Validate release metadata
        run: node tests/release/check-version.mjs
        env:
          ANIM8_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Qualify the complete release
        uses: ./.github/actions/qualify-release
        env:
          ANIM8_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Verify publishing credentials and matching release tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: node tests/release/preflight.mjs --publish
        env:
          ANIM8_RELEASE_TAG: ${{ github.ref_name }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish public packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
