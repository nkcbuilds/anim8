name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.28.0
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Validate release metadata
        run: node tests/release/check-version.mjs
        env:
          ANIM8_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

      - name: Run release checks
        run: pnpm check

      - name: Install browser matrix
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Run browser matrix
        run: pnpm browser
        env:
          ANIM8_BROWSER_REQUIRE_ALL: "1"

      - name: Publish public packages
        if: startsWith(github.ref, 'refs/tags/v')
        run: pnpm -r --filter "./packages/**" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
